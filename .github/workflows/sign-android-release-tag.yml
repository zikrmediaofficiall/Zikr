name: Sign Android release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Canonical semantic Android tag"
        required: true
        type: string
      commit_sha:
        description: "Exact release-preparation commit SHA on main"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-sign-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign, verify, and create the Android Draft Release
    runs-on: ubuntu-24.04
    environment:
      name: android-release-signing
    steps:
      - name: Checkout exact release-preparation commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact main source and release metadata
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid semantic release tag"; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid release commit SHA"; exit 1; }
          MAIN_SHA="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          test "$MAIN_SHA" = "$COMMIT_SHA" || { echo "::error::Release commit is not the current main HEAD"; exit 1; }
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          RELEASE_TAG="$(tr -d '\r\n' < .release-tag)"
          test "v$PACKAGE_VERSION" = "$TAG"
          test "$RELEASE_TAG" = "$TAG"
          NOTES="docs/releases/$PACKAGE_VERSION.md"
          test -s "$NOTES"
          grep -Fq "Release tag: `$TAG`" "$NOTES"
          if git ls-remote --exit-code --tags https://github.com/${GITHUB_REPOSITORY}.git "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; immutable tags are never replaced"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for this tag"
            exit 1
          fi

      - name: Import owner-managed OpenPGP key and create signed tag
        id: sign
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.ANDROID_RELEASE_TAG_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.ANDROID_RELEASE_TAG_GPG_PASSPHRASE }}
          EXPECTED_FINGERPRINT: ${{ vars.ANDROID_RELEASE_TAG_GPG_FINGERPRINT }}
          SIGNING_EMAIL: ${{ vars.ANDROID_RELEASE_SIGNING_EMAIL }}
          SIGNING_NAME: ${{ vars.ANDROID_RELEASE_SIGNING_NAME }}
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          : "${GPG_PRIVATE_KEY:?Missing protected signing key}"
          : "${EXPECTED_FINGERPRINT:?Missing trusted GPG fingerprint}"
          : "${SIGNING_EMAIL:?Missing verified signer email}"
          : "${SIGNING_NAME:?Missing signer display name}"
          EXPECTED_FINGERPRINT="$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          TMP_DIR="$(mktemp -d)"
          export GNUPGHOME="$TMP_DIR/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'rm -rf "$TMP_DIR"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          ACTUAL_FINGERPRINT="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || { echo "::error::Signing key fingerprint mismatch"; exit 1; }
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/$OWNER/gpg_keys" > "$TMP_DIR/github-gpg-keys.json"
          jq -r --arg email "$SIGNING_EMAIL" '.[] | select(any(.emails[]?; .email == $email)) | .public_key // empty' \
            "$TMP_DIR/github-gpg-keys.json" > "$TMP_DIR/github-matching-public-keys.asc"
          test -s "$TMP_DIR/github-matching-public-keys.asc" || { echo "::error::Signer email is not registered on a GitHub GPG key"; exit 1; }
          gpg --batch --import "$TMP_DIR/github-matching-public-keys.asc" >/dev/null 2>&1
          gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" { print toupper($10) }' | grep -Fxq "$EXPECTED_FINGERPRINT" || {
            echo "::error::Configured fingerprint is not registered to the verified signer email on GitHub"; exit 1;
          }
          git config user.name "$SIGNING_NAME"
          git config user.email "$SIGNING_EMAIL"
          git config gpg.program gpg
          git config user.signingkey "$EXPECTED_FINGERPRINT"
          git tag -s -u "$EXPECTED_FINGERPRINT" "$TAG" "$COMMIT_SHA" -m "ZIKR Android $TAG"
          git verify-tag --raw "$TAG" > "$TMP_DIR/verify-tag.txt" 2>&1
          VERIFIED_PRIMARY_FINGERPRINT="$(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print toupper(NF >= 11 ? $NF : $3); exit }' "$TMP_DIR/verify-tag.txt")"
          test "$VERIFIED_PRIMARY_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || {
            echo "::error::Local tag signature does not match the trusted primary fingerprint"; cat "$TMP_DIR/verify-tag.txt"; exit 1;
          }

      - name: Push immutable signed tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG:refs/tags/$TAG"

      - name: Verify GitHub confirms the exact cryptographic tag signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG")"
            REF_TYPE="$(jq -r '.object.type' <<< "$REF_JSON")"
            REF_SHA="$(jq -r '.object.sha' <<< "$REF_JSON")"
            test "$REF_TYPE" = "tag" || { echo "::error::Release tag is not annotated"; exit 1; }
            TAG_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$REF_SHA")"
            VERIFIED="$(jq -r '.verification.verified // false' <<< "$TAG_JSON")"
            REASON="$(jq -r '.verification.reason // ""' <<< "$TAG_JSON")"
            TARGET_SHA="$(jq -r '.object.sha // ""' <<< "$TAG_JSON")"
            if [[ "$VERIFIED" == "true" && "$REASON" == "valid" && "$TARGET_SHA" == "$COMMIT_SHA" ]]; then
              echo "GitHub verified $TAG -> $TARGET_SHA (signature valid)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::GitHub did not verify the signed tag or exact tag target"; exit 1

      - name: Create the draft release only after GitHub tag verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES="docs/releases/$VERSION.md"
          RELEASE_JSON="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$COMMIT_SHA" \
            -f name="ZIKR Android $TAG" \
            -F draft=true \
            -F prerelease=false \
            -f body="$(cat "$NOTES")")"
          test "$(jq -r '.tag_name' <<< "$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.draft' <<< "$RELEASE_JSON")" = "true"
          test "$(jq -r '.prerelease' <<< "$RELEASE_JSON")" = "false"
          echo "Draft Release created only after GitHub verified the signed tag."
