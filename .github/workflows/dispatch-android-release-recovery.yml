name: Dispatch guarded Android release recovery

on:
  push:
    branches:
      - "android-release-dispatch-v*"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: read

jobs:
  dispatch:
    if: github.actor == 'zikrofficial-X' && ((github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/android-release-v') || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/android-release-dispatch-v')))
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch publisher only for the exact guarded release with a successful signed build
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const eventName = context.eventName;
            const eventSha = String(context.sha ?? "");
            const isPushRecoveryTrigger =
              eventName === "push" &&
              /^refs\\/heads\\/android-release-dispatch-v[0-9]+\\.[0-9]+\\.[0-9]+$/.test(context.ref);
            let requestedTag = "";
            let sourceSha = eventSha;

            if (eventName !== "workflow_dispatch" && !isPushRecoveryTrigger) {
              core.info("Skipping: only an owner-triggered workflow dispatch or canonical recovery-trigger branch is allowed.");
              return;
            }

            if (isPushRecoveryTrigger) {
              requestedTag = context.ref.replace("refs/heads/android-release-dispatch-", "");
              const { data: tagRef } = await github.rest.git.getRef({
                owner, repo, ref: "tags/" + requestedTag,
              });
              sourceSha = tagRef.object.sha;
              if (tagRef.object.type === "tag") {
                const { data: tagObject } = await github.rest.git.getTag({
                  owner, repo, tag_sha: tagRef.object.sha,
                });
                if (tagObject.object.type !== "commit") {
                  core.setFailed("Android release tag does not resolve directly to a commit: " + requestedTag);
                  return;
                }
                sourceSha = tagObject.object.sha;
              }
            }

            if (!/^[0-9a-f]{40}$/i.test(sourceSha)) {
              core.setFailed("The exact Android release source SHA could not be resolved.");
              return;
            }

            const readText = async (path, ref) => {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path, ref,
              });
              if (Array.isArray(data) || data.type !== "file" || !data.content) {
                throw new Error("Expected a text file in the release source commit: " + path);
              }
              return Buffer.from(data.content.replace(/\n/g, ""), "base64").toString("utf8");
            };

            const [tagText, packageText, retryText] = await Promise.all([
              readText(".release-tag", sourceSha),
              readText("package.json", sourceSha),
              readText("docs/finalization/RELEASE_RETRY.flag", sourceSha),
            ]);

            const tag = tagText.trim();
            const version = String(JSON.parse(packageText).version ?? "");
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag) || tag !== "v" + version) {
              core.info("Skipping: source version and canonical release tag do not match.");
              return;
            }
            if (retryText.trim() !== "RETRY") {
              core.info("Skipping: the repository release retry guard is not enabled.");
              return;
            }

            const notes = await readText("docs/releases/" + version + ".md", eventSha);
            const backtick = String.fromCharCode(96);
            if (!notes.includes("Release tag: " + backtick + tag + backtick)) {
              core.setFailed("Release notes do not declare the canonical release tag.");
              return;
            }

            const recoveryBranch = "android-release-" + tag;
            const isTagDispatch = context.ref === "refs/tags/" + tag;

            if (!isTagDispatch) {
              try {
                const { data: branchData } = await github.rest.repos.getBranch({
                  owner, repo, branch: recoveryBranch,
                });
                if (branchData.commit.sha !== sourceSha) {
                  core.info("Skipping: the canonical Android recovery branch does not match the immutable tag target.");
                  return;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info("Skipping: the guarded Android recovery branch does not exist.");
                return;
              }
            }

            if (eventName !== "workflow_dispatch" && !isPushRecoveryTrigger) {
              core.info("Skipping: recovery must be started by the protected release pipeline or owner-only canonical trigger.");
              return;
            }
            if (!isTagDispatch &&
                !context.ref.startsWith("refs/heads/android-release-v") &&
                !isPushRecoveryTrigger) {
              core.info("Skipping: dispatch ref is neither the exact release tag, guarded recovery branch, nor owner-only dispatch trigger.");
              return;
            }
            if (!isPushRecoveryTrigger && sourceSha !== eventSha) {
              core.info("Skipping: dispatch SHA does not match the exact release source commit.");
              return;
            }
            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
              owner, repo, ref: sourceSha,
            });
            const androidBuild = (combined.statuses ?? []).find(
              item => item.context === "ci/circleci: android-rebuild"
            );
            if (!androidBuild || androidBuild.state !== "success") {
              core.info("Skipping: CircleCI has not successfully signed the current recovery branch commit.");
              return;
            }

            const { data: releases } = await github.rest.repos.listReleases({
              owner, repo, per_page: 100,
            });
            let release = releases.find(
              item => item.tag_name === tag || item.name === "ZIKR Android " + tag
            );

            // GitHub can expose this legacy recovery draft only by its numeric ID;
            // the list and get-by-tag endpoints do not consistently return it.
            if (!release && tag === "v1.1.4") {
              const fallback = await github.rest.repos.getRelease({
                owner, repo, release_id: 413815658,
              });
              release = fallback.data;
            }

            if (!release || release.tag_name !== tag) {
              core.info("Skipping: no matching GitHub Release exists for " + tag + ".");
              return;
            }
            if (release.draft !== true || release.prerelease === true) {
              core.info("Skipping: the matching GitHub Release is not an eligible draft.");
              return;
            }

            // Recovery may never rebuild from a later branch and publish those
            // binaries under an earlier semantic tag. Resolve annotated tags
            // to their target commit and require an exact source-SHA match.
            const { data: tagRef } = await github.rest.git.getRef({
              owner, repo, ref: "tags/" + tag,
            });
            let tagTargetSha = tagRef.object.sha;
            if (tagRef.object.type === "tag") {
              const { data: tagObject } = await github.rest.git.getTag({
                owner, repo, tag_sha: tagRef.object.sha,
              });
              if (tagObject.object.type !== "commit") {
                core.setFailed("Android release tag does not resolve directly to a commit: " + tag);
                return;
              }
              tagTargetSha = tagObject.object.sha;
            }
            if (tagTargetSha !== sourceSha) {
              core.setFailed(
                "Android release provenance mismatch: tag " + tag +
                " targets " + tagTargetSha + " but recovery source is " + sourceSha +
                ". Refusing to publish. Prepare a new semantic release or build from the exact tag commit."
              );
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "publish-android-release-assets.yml",
              ref: isTagDispatch ? tag : recoveryBranch,
              inputs: { retry: "true" },
            });
            core.info("Dispatched guarded Android asset verification/publication for " + tag + " from " + sourceSha + ".");
