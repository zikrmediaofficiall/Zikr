name: ZIKR Autonomous AI Video Worker

on:
  # GitHub Actions is the sole production owner for recurring video generation.
  # Publishing is intentionally handled by a separate GitHub workflow.
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new video jobs to seed in this run"
        required: false
        default: "3"
        type: string
      urgent:
        description: "Whether this dispatch originated from the admin Run Now control"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: zikr-background-worker
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      # The canonical Supabase URL is public configuration; only the service-role key remains secret.
      SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
      NEXT_PUBLIC_SITE_URL: https://zikrmediaofficial.vercel.app
      # Free-only production path: no Gemini/custom endpoint billing; public free Spaces may fall back to FFmpeg.
      VIDEO_FREE_ONLY: "true"
      # Optional JSON GitHub environment variable: up to five public Gradio Spaces compatible with Wan 2.2 or LTX Fast.
      HF_VIDEO_CUSTOM_SPACES: ${{ vars.HF_VIDEO_CUSTOM_SPACES }}
      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_AUDIO_SMOKE_TEST: "false"
      # Video experiments, off unless the GitHub environment variable is "true".
      VIDEO_HOOK_EXPERIMENT_ENABLED: ${{ vars.VIDEO_HOOK_EXPERIMENT_ENABLED || 'false' }}
      VIDEO_THUMBNAIL_HOOK_FRAME_ENABLED: ${{ vars.VIDEO_THUMBNAIL_HOOK_FRAME_ENABLED || 'false' }}
      AUTO_VIDEO_ENABLED: "true"
      AUTO_VIDEO_PUBLISH_ENABLED: "true"
      AUTO_VIDEO_PUBLISH_REQUIRES_APPROVAL: "false"
      FACEBOOK_PUBLISHING_REQUESTED: ${{ vars.FACEBOOK_PUBLISHING_ENABLED || 'true' }}
      YOUTUBE_PUBLISHING_REQUESTED: ${{ vars.YOUTUBE_PUBLISHING_ENABLED || 'true' }}
      YOUTUBE_UPLOAD_PRIVACY: "public"
      AUTO_VIDEO_BATCH_SIZE: ${{ inputs.batch_size || '3' }}
      DAILY_VIDEO_TARGET: "2"
      PROMO_VIDEO_WEEKLY_TARGET: "0"
      PROMO_VIDEO_TIMEZONE: "Africa/Cairo"
      AUTO_VIDEO_URGENT: ${{ inputs.urgent || 'false' }}
      VIDEO_DAILY_LIMIT: "24"
      VIDEO_AUTOMATION_DRY_RUN: "false"
      VIDEO_AI_ENABLED: "true"
      VIDEO_AI_ATTEMPTS_PER_RUN: "4"
      VIDEO_PROVIDER_ORDER: "hf_ltx_fast,hf_wan,template"
      FREE_VIDEO_PROVIDER_ENABLED: "false"
      COMFYUI_ENABLED: "false"
      HF_WAN_VIDEO_ENABLED: "true"
      HF_LTX_FAST_VIDEO_ENABLED: "true"
      HF_VIDEO_PROVIDER_TIMEOUT_MS: "150000"
      VIDEO_WORKER_BATCH_SIZE: "2"
      HF_WAN_SPACE: "zerogpu-aoti/wan2-2-fp8da-aoti-faster"
      HF_LTX_FAST_SPACE: "Lightricks/ltx-video-distilled"
      ARABIC_TTS_VENV: ${{ github.workspace }}/.automation-venv
      ARABIC_TTS_PROFILE: "hadith_male_msa"
      ARABIC_TTS_PYTHON: ${{ github.workspace }}/.automation-venv/bin/python
      HF_VIDEO_PYTHON: ${{ github.workspace }}/.automation-venv/bin/python
      # Generate on free visual AI providers with deterministic FFmpeg fallback; the canonical video record stays in ZIKR.
      AUTO_VIDEO_SECONDS: "25"
      # Every generated video must pass snapshot-bound automated QA; Kids-suitable videos also require the strict automated Kids QA before public publishing and Kids-section cross-listing. No routine human approval hold is used.
      BACKGROUND_JOB_TARGET: "videos"
      VIDEO_TEMPLATE_VERSION: "2026-11-06-composition-sync-v8"
      VIDEO_OUTPUT_CRF: "17"
      VIDEO_AUDIO_BITRATE: "192k"
      VERIFY_VIDEO_RUNTIME_TOOLS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production automation credentials before dependency installation
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "Missing canonical SUPABASE_URL configuration." >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "Missing production environment secret: SUPABASE_SERVICE_ROLE_KEY" >&2; exit 1; }
          test -n "${CLOUDINARY_CLOUD_NAME:-}" || { echo "Missing production environment secret: CLOUDINARY_CLOUD_NAME" >&2; exit 1; }
          test -n "${CLOUDINARY_API_KEY:-}" || { echo "Missing production environment secret: CLOUDINARY_API_KEY" >&2; exit 1; }
          test -n "${CLOUDINARY_API_SECRET:-}" || { echo "Missing production environment secret: CLOUDINARY_API_SECRET" >&2; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 22 with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Install and verify video and Arabic TTS runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-noto-core python3-venv
          python3 -m venv "$GITHUB_WORKSPACE/.automation-venv"
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" -m pip install --quiet --disable-pip-version-check --no-cache-dir "edge-tts==7.3.1" "gradio_client==2.7.1" "gTTS==2.5.4"
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" -c 'import edge_tts, gradio_client, gtts; print("edge-tts + gradio_client + gTTS imports: OK")'
          "$GITHUB_WORKSPACE/.automation-venv/bin/edge-tts" --version
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" -c 'import gradio_client; print("gradio_client:", gradio_client.__version__)'
          command -v ffmpeg >/dev/null
          command -v rsvg-convert >/dev/null
          test -f /usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf

          for asset in public/video/templates/calm.svg public/video/templates/dawn.svg public/video/templates/emerald.svg public/video/templates/gold.svg public/video/templates/night.svg public/video/templates/paper.svg public/video/templates/rose.svg public/video/templates/andalusian-arch.svg public/video/templates/midnight-skyline.svg public/video/templates/oasis-dawn.svg public/video/templates/desert-caravan.svg public/video/templates/geometric-mosaic.svg public/video/templates/lantern-glow.svg public/video/templates/layl.svg public/video/templates/layl-character.svg public/video/templates/manuscript-library.svg public/video/templates/moonlit-sea.svg public/video/templates/olive-grove.svg public/video/templates/desert-dusk.svg public/video/templates/coastal-blue.svg public/video/templates/botanical.svg public/video/templates/library.svg public/video/templates/geometric.svg public/video/templates/marble.svg public/video/templates/cinematic.svg public/video/templates/starfield.svg public/video/templates/mountain-dawn.svg public/video/templates/heritage.svg public/video/templates/minimal-studio.svg public/video/templates/rainy-window.svg public/video/templates/watercolor-sky.svg public/video/templates/old-city.svg public/video/templates/desert-rose.svg public/video/templates/mosaic-blue.svg public/video/templates/satin-night.svg public/video/templates/sunlit-arch.svg public/video/templates/olive-branch.svg public/video/templates/minimal-cream.svg public/video/templates/kids-garden.svg public/video/templates/kids-nature.svg public/video/templates/kids-neighborhood.svg public/video/templates/kids-workshop.svg public/video/templates/kids-space.svg public/video/templates/kids-ocean.svg public/video/templates/kids-forest.svg public/video/templates/kids-playground.svg public/video/templates/kids-classroom.svg public/video/templates/kids-adventure.svg public/video/templates/kids-jungle.svg public/video/templates/kids-robotics.svg public/video/templates/kids-animals.svg public/video/templates/kids-weather.svg; do
            test -s "$asset"
            out="/tmp/$(basename "$asset" .svg).png"
            rsvg-convert -w 1080 -h 1920 "$asset" -o "$out"
            test -s "$out"
          done

          echo "ffmpeg: $(ffmpeg -version | head -n 1)"
          echo "rsvg-convert: $(rsvg-convert --version 2>&1 | head -n 1)"
          echo "Arabic fonts: Noto Naskh Arabic + Noto Sans Arabic available"

      - name: Verify production video contracts
        run: |
          set -euo pipefail
          pnpm scheduler:check
          pnpm video:contract:check
          pnpm voice:factory:check
          pnpm video:factory:check
          pnpm video:qa:check
          pnpm kids:video:check

      - name: Smoke-test video worker imports
        run: |
          set -euo pipefail
          pnpm video:engine:check
          pnpm exec tsx -e 'import("./scripts/jobs/template-video-automation.ts").then(() => console.log("Internal video worker module smoke test: OK")).catch((error) => { console.error(error); process.exitCode = 1 })'
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" -m py_compile scripts/jobs/hf-space-video.py
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" -m py_compile scripts/generate-arabic-voice.py
          # Fail before touching the production queue if neither Arabic TTS provider can synthesize audio.
          "$GITHUB_WORKSPACE/.automation-venv/bin/python" scripts/generate-arabic-voice.py \
            --text "اختبار صوت عربي لمنصة ذكر." \
            --output "$RUNNER_TEMP/zikr-arabic-tts-smoke.mp3"
          test -s "$RUNNER_TEMP/zikr-arabic-tts-smoke.mp3"
          test "$(stat -c '%s' "$RUNNER_TEMP/zikr-arabic-tts-smoke.mp3")" -ge 1024
          # Layl is pinned to the Egyptian male neural voice. Microsoft's Edge endpoint sometimes rejects
          # a second connection from a hosted runner, which used to abort the whole worker (no video was
          # produced from 2026-11-24 onward). Retry a few times; if the Egyptian voice is still
          # unavailable, warn and continue so the other video types are not blocked. Layl episodes keep
          # their pinned voice (no generic fallback) and simply fail on their own if it stays unavailable.
          layl_ok=false
          for attempt in 1 2 3 4; do
            if "$GITHUB_WORKSPACE/.automation-venv/bin/python" scripts/generate-arabic-voice.py \
              --text "أهلاً بيكم في دقيقتين مع ليل من منصة ذكر." \
              --voice "ar-EG-ShakirNeural" \
              --rate="-7%" \
              --pitch="0Hz" \
              --output "$RUNNER_TEMP/zikr-layl-egyptian-tts-smoke.mp3" \
              && test -s "$RUNNER_TEMP/zikr-layl-egyptian-tts-smoke.mp3" \
              && test "$(stat -c '%s' "$RUNNER_TEMP/zikr-layl-egyptian-tts-smoke.mp3")" -ge 1024; then
              layl_ok=true
              break
            fi
            echo "Egyptian voice smoke attempt $attempt failed; retrying in $((attempt * 8))s"
            sleep $((attempt * 8))
          done
          if [ "$layl_ok" != "true" ]; then
            echo "::warning::Egyptian Arabic neural voice (ar-EG-ShakirNeural) is unavailable from this runner. Continuing: Layl episodes will not synthesize until it recovers; other videos are unaffected."
          fi
          ffmpeg -version | head -n 1

      - name: Gemini audio evaluation smoke test
        if: env.GEMINI_AUDIO_SMOKE_TEST == 'true'
        run: pnpm exec tsx scripts/verify-gemini-audio.ts

      - name: Verify Supabase data-plane access
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/quran_ayahs?select=id&limit=1")"
          echo "Supabase REST quran_ayahs HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            echo "Supabase data-plane authentication/configuration failed:" >&2
            head -c 500 "$response_file" >&2 || true
            exit 1
          fi


      - name: Run autonomous queue
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ADMIN_QUEUE_ALERT_WEBHOOK_URL: ${{ secrets.ADMIN_QUEUE_ALERT_WEBHOOK_URL }}
          ADMIN_QUEUE_ALERT_WEBHOOK_SECRET: ${{ secrets.ADMIN_QUEUE_ALERT_WEBHOOK_SECRET }}
          ADMIN_QUEUE_ALERT_EMAIL_TO: ${{ vars.ADMIN_QUEUE_ALERT_EMAIL_TO || secrets.ADMIN_QUEUE_ALERT_EMAIL_TO }}
          ADMIN_QUEUE_ALERT_EMAIL_FROM: ${{ vars.ADMIN_QUEUE_ALERT_EMAIL_FROM || secrets.ADMIN_QUEUE_ALERT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: pnpm background:jobs

      - name: Print run summary
        if: always()
        run: |
          echo "ZIKR autonomous video worker completed."
          echo "The queue seeds Quran/Hadith/Dua/Adhkar, verified stories, serialized child-safe story episodes, and general reminders."
          echo "Free-only mode skips paid Gemini and custom endpoints; approved public Hugging Face Spaces are optional and FFmpeg templates are the fallback."
          echo "No paid AI API is required for source selection, Arabic narration, rendering, automated QA, storage, or queue creation."
          echo "Worker validation includes Node import, FFmpeg, and Supabase data-plane smoke tests."

      - name: Record worker outcome for the admin dashboard
        if: always()
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          WORKER_STATUS: ${{ job.status }}
          WORKER_RUN_ID: ${{ github.run_id }}
          WORKER_EVENT: ${{ github.event_name }}
        run: |
          # Best effort: never fail the run because the status note could not be saved.
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '{"key":"video_worker_last_run","value":{"status":"%s","runId":"%s","runUrl":"https://github.com/%s/actions/runs/%s","event":"%s","at":"%s"},"updated_at":"%s"}' \
            "$WORKER_STATUS" "$WORKER_RUN_ID" "$GITHUB_REPOSITORY" "$WORKER_RUN_ID" "$WORKER_EVENT" "$now" "$now")"
          curl -sS -o /dev/null -w 'admin status note HTTP %{http_code}\n' -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data "$body" \
            "$SUPABASE_URL/rest/v1/admin_settings?on_conflict=key" || true
