name: ZIKR English Content Sync

on:
  # CircleCI remains the primary daily run. This later, bounded run is a backup
  # using the protected GitHub production environment when CircleCI credentials or jobs fail.
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      article_batch_size:
        description: "Number of articles to translate in this run (maximum 10)"
        required: false
        default: "10"
      content_batch_size:
        description: "Number of rows per content category to translate in this run (maximum 10)"
        required: false
        default: "10"
      hadith_batch_size:
        description: "Number of Hadith records to synchronize in this run (maximum 100)"
        required: false
        default: "75"

concurrency:
  group: zikr-english-content-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Bounded English content sync
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 100
    env:
      SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
      TRANSLATION_BATCH_SIZE: ${{ github.event.inputs.article_batch_size || '10' }}
      CONTENT_TRANSLATION_BATCH_SIZE: ${{ github.event.inputs.content_batch_size || '10' }}
      HADITH_API_BASE_URL: https://ummahapi.com/api/hadith
      HADITH_TRANSLATION_BATCH_SIZE: ${{ github.event.inputs.hadith_batch_size || '75' }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate Supabase credentials before installing dependencies
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "Missing canonical Supabase URL configuration." >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "Missing production environment secret: SUPABASE_SERVICE_ROLE_KEY" >&2; exit 1; }
          test -n "${GEMINI_API_KEY:-}" || { echo "Missing production environment secret: GEMINI_API_KEY" >&2; exit 1; }
          echo "Production Supabase and Gemini credentials are present." >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
      - name: Run one bounded article batch and one bounded Hadith batch
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          set -u
          article_status=0
          content_status=0
          hadith_status=0

          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            echo "Translating at most ${TRANSLATION_BATCH_SIZE} published articles."
            timeout --signal=TERM --kill-after=60s 40m pnpm translate:articles:en || article_status=$?

            echo "Translating at most ${CONTENT_TRANSLATION_BATCH_SIZE} records per additional content category."
            timeout --signal=TERM --kill-after=60s 40m pnpm translate:content:en || content_status=$?
          else
            echo "Missing production environment secret: GEMINI_API_KEY; article and additional content translation cannot run." >&2
            article_status=1
            content_status=1
          fi

          echo "Synchronizing at most ${HADITH_TRANSLATION_BATCH_SIZE} Hadith records."
          timeout --signal=TERM --kill-after=60s 15m pnpm sync:hadith:en || hadith_status=$?

          if (( article_status != 0 || content_status != 0 || hadith_status != 0 )); then
            echo "English sync incomplete (articles=${article_status}, other-content=${content_status}, hadith=${hadith_status})." >&2
            exit 1
          fi
