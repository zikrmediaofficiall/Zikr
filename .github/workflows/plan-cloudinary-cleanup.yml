name: ZIKR Plan Cloudinary Cleanup (dry run)

# Manual and read-only. Lists generated Cloudinary videos that could be freed because a confirmed
# YouTube publication exists. It never deletes, uploads, or writes anything.
on:
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "Minimum days since the last publication"
        required: true
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: plan-cloudinary-cleanup
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the cleanup dry-run (read-only)
        env:
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SUPABASE_URL: https://zqtssvlvmkzeeyqghqfk.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/jobs/plan-cloudinary-cleanup.mjs
